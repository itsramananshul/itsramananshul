name: Metrics
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"
      - "scripts/split-repositories.cjs"

permissions: { contents: write }
concurrency: { group: metrics, cancel-in-progress: true }

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: calendar-languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: itsramananshul
          template: classic
          config_timezone: America/New_York
          commits_authoring: "itsramananshul, anshul raman"
          output_action: commit
          committer_branch: metrics
          plugins_errors_fatal: "no"
          retries: 3
          retries_delay: 60
          committer_message: "chore(metrics): update calendar-languages"
          filename: metrics.calendar-languages.svg
          base: ""
          plugin_isocalendar: "yes"
          plugin_isocalendar_duration: half-year
          plugin_languages: "yes"
          plugin_languages_indepth: "yes"
          plugin_languages_details: "bytes-size, percentage"
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_analysis_timeout: 15
  repositories:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: repositories
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: itsramananshul
          template: classic
          config_timezone: America/New_York
          commits_authoring: "itsramananshul, anshul raman"
          output_action: commit
          committer_branch: metrics
          plugins_errors_fatal: "no"
          retries: 3
          retries_delay: 60
          committer_message: "chore(metrics): update repositories"
          filename: metrics.repositories.svg
          base: ""
          plugin_repositories: "yes"
          plugin_repositories_featured: "itsramananshul/Revlu-hackathon, itsramananshul/gradintel, itsramananshul/Portfolio, itsramananshul/SolFlow"
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          ref: metrics
          path: generated
      - name: Split repositories into individually linked images
        env:
          NODE_PATH: ${{ runner.temp }}/card-renderer/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/card-renderer" --no-package-lock playwright@1.62.1
          node "$RUNNER_TEMP/card-renderer/node_modules/playwright/cli.js" install --with-deps chromium
          node source/scripts/split-repositories.cjs generated/metrics.repositories.svg generated
      - name: Publish individually linked repository images
        working-directory: generated
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metrics.repository.*.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(metrics): update linked repository images"
            git pull --rebase origin metrics
            git push origin HEAD:metrics
          fi
