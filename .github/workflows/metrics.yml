name: Metrics
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

permissions: { contents: write }
concurrency: { group: metrics, cancel-in-progress: true }

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: base
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: itsramananshul
          template: classic
          config_timezone: America/New_York
          output_action: commit
          committer_branch: metrics
          committer_message: "chore(metrics): update base"
          plugins_errors_fatal: "no"
          retries: 3
          retries_delay: 60
          filename: metrics.base.svg
          base: "header, activity, community, repositories, metadata"
      - name: isocalendar
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: itsramananshul
          template: classic
          config_timezone: America/New_York
          output_action: commit
          committer_branch: metrics
          committer_message: "chore(metrics): update isocalendar"
          plugins_errors_fatal: "no"
          retries: 3
          retries_delay: 60
          filename: metrics.isocalendar.svg
          base: ""
          plugin_isocalendar: "yes"
          plugin_isocalendar_duration: half-year
      - name: habits
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: itsramananshul
          template: classic
          config_timezone: America/New_York
          output_action: commit
          committer_branch: metrics
          committer_message: "chore(metrics): update habits"
          plugins_errors_fatal: "no"
          retries: 3
          retries_delay: 60
          filename: metrics.habits.svg
          base: ""
          plugin_habits: "yes"
          plugin_habits_facts: "no"
          plugin_habits_charts: "yes"
          plugin_habits_charts_type: classic
          plugin_habits_from: 200
          plugin_habits_days: 14
      - name: stars
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: itsramananshul
          template: classic
          config_timezone: America/New_York
          output_action: commit
          committer_branch: metrics
          committer_message: "chore(metrics): update stars"
          plugins_errors_fatal: "no"
          retries: 3
          retries_delay: 60
          filename: metrics.stars.svg
          base: ""
          plugin_stars: "yes"
          plugin_stars_limit: 4
      - name: languages
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: itsramananshul
          template: classic
          config_timezone: America/New_York
          output_action: commit
          committer_branch: metrics
          committer_message: "chore(metrics): update languages"
          plugins_errors_fatal: "no"
          retries: 3
          retries_delay: 60
          filename: metrics.languages.svg
          base: ""
          plugin_languages: "yes"
          plugin_languages_indepth: "yes"
          plugin_languages_details: "bytes-size, percentage"
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_analysis_timeout: 15
      - name: achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: itsramananshul
          template: classic
          config_timezone: America/New_York
          output_action: commit
          committer_branch: metrics
          committer_message: "chore(metrics): update achievements"
          plugins_errors_fatal: "no"
          retries: 3
          retries_delay: 60
          filename: metrics.achievements.svg
          base: ""
          plugin_achievements: "yes"
          plugin_achievements_display: compact
          plugin_achievements_threshold: "C"
          plugin_achievements_secrets: "yes"
      - name: followup
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: itsramananshul
          template: classic
          config_timezone: America/New_York
          output_action: commit
          committer_branch: metrics
          committer_message: "chore(metrics): update followup"
          plugins_errors_fatal: "no"
          retries: 3
          retries_delay: 60
          filename: metrics.followup.svg
          base: ""
          plugin_followup: "yes"
          plugin_followup_indepth: "yes"
          plugin_followup_sections: repositories
      - name: lines
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: itsramananshul
          template: classic
          config_timezone: America/New_York
          output_action: commit
          committer_branch: metrics
          committer_message: "chore(metrics): update lines"
          plugins_errors_fatal: "no"
          retries: 3
          retries_delay: 60
          filename: metrics.lines.svg
          base: ""
          plugin_lines: "yes"
          plugin_lines_sections: base
          plugin_lines_repositories_limit: 4
      - name: topics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: itsramananshul
          template: classic
          config_timezone: America/New_York
          output_action: commit
          committer_branch: metrics
          committer_message: "chore(metrics): update topics"
          plugins_errors_fatal: "no"
          retries: 3
          retries_delay: 60
          filename: metrics.topics.svg
          base: ""
          plugin_topics: "yes"
          plugin_topics_mode: starred
          plugin_topics_sort: stars
          plugin_topics_limit: 12
      - name: notable
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: itsramananshul
          template: classic
          config_timezone: America/New_York
          output_action: commit
          committer_branch: metrics
          committer_message: "chore(metrics): update notable"
          plugins_errors_fatal: "no"
          retries: 3
          retries_delay: 60
          filename: metrics.notable.svg
          base: ""
          plugin_notable: "yes"
          plugin_notable_from: organization
          plugin_notable_repositories: "yes"
          plugin_notable_indepth: "no"
